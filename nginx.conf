server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    types {
        application/zip zip;
        text/html  html;
        video/mp4  mp4;
        image/webp webp;
    }
    default_type application/octet-stream;

    location = /health {
        access_log off;
        return 200 "ok\n";
    }

    # The film's name never changes but its contents do when it is re-rendered,
    # so no-cache: the browser keeps it but revalidates. Range requests (which
    # video seeking needs) are on by default for static files.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
